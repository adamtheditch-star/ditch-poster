name: Post shows to Instagram

on:
  schedule:
    - cron: "0 * * * *"   # GitHub often runs this only every few hours, so each run watches
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-shows
  cancel-in-progress: true   # a newer run replaces the one that is watching

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and the mono font the pattern cards use
        # Never fatal, and never slow: without ffmpeg the Stories are stills, and without
        # the font the cards fall back to Poppins. A flaky Ubuntu mirror once held this
        # step for 27 minutes and stopped the posting, which is a far worse outcome.
        timeout-minutes: 4
        continue-on-error: true
        run: |
          APT="-qq -o Acquire::Retries=2 -o Acquire::http::Timeout=15"
          sudo apt-get update $APT || true
          sudo apt-get install -y $APT ffmpeg fonts-dejavu-core \
            || echo "apt unavailable; carrying on without it"

      - name: Fetch Roboto Mono, which the cards are set in
        # Never fatal: without it ditch_pattern falls back to DejaVu and then Poppins, so
        # a bad day at Google's font repo costs the look of a card, never the post.
        timeout-minutes: 2
        continue-on-error: true
        run: |
          mkdir -p assets
          curl -fsS --max-time 60 -o assets/RobotoMono.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/robotomono/RobotoMono%5Bwght%5D.ttf" \
            || echo "could not fetch Roboto Mono; the cards will fall back"

      - run: pip install -r requirements.txt

      - name: Watch the schedule and post
        env:
          RADIOCO_STATION_ID: ${{ vars.RADIOCO_STATION_ID || 'sd72a8fdcd' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          IGNORE_SHOWS: ${{ vars.IGNORE_SHOWS }}
          COMING_UP_MINUTES: ${{ vars.COMING_UP_MINUTES }}
          COMING_UP_AS: ${{ vars.COMING_UP_AS }}
          LIVE_NOW_AS: ${{ vars.LIVE_NOW_AS }}
          HASHTAGS: ${{ vars.HASHTAGS }}
          VIDEO_STORIES: ${{ vars.VIDEO_STORIES }}
          VIDEO_SECONDS: ${{ vars.VIDEO_SECONDS }}
          EXTRAS: ${{ vars.EXTRAS }}
          WEEKLY_AS: ${{ vars.WEEKLY_AS }}
          WEEKLY_DAY: ${{ vars.WEEKLY_DAY }}
          WEEKLY_HOUR: ${{ vars.WEEKLY_HOUR }}
          WEEKLY_VIDEO: ${{ vars.WEEKLY_VIDEO }}
          MIXCLOUD_USER: ${{ vars.MIXCLOUD_USER }}
          MIXCLOUD_SINCE_HOURS: ${{ vars.MIXCLOUD_SINCE_HOURS }}
          LISTEN_BACK_AS: ${{ vars.LISTEN_BACK_AS }}
          LISTEN_BACK_VIDEO: ${{ vars.LISTEN_BACK_VIDEO }}
          MAX_LISTEN_BACK_PER_RUN: ${{ vars.MAX_LISTEN_BACK_PER_RUN }}
          POLL_MINUTES: ${{ vars.POLL_MINUTES || '5' }}
        run: python ditch_poster.py --watch ${{ vars.WATCH_MINUTES || '330' }}

      - name: Remember what was posted
        if: always()
        run: |
          git config user.name "ditch-poster"
          git config user.email "ditch-poster@users.noreply.github.com"
          # Keep this run's copies aside, then rebuild the commit on top of whatever main
          # looks like now. A plain rebase conflicts when two runs overlap and the loser's
          # receipts are dropped, which is how a show gets posted twice.
          mkdir -p /tmp/mystate
          for f in state.json state.dry.json; do [ -f "$f" ] && cp "$f" /tmp/mystate/; done
          ls /tmp/mystate/*.json >/dev/null 2>&1 || exit 0
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git checkout -q -f -B post-history origin/main
            python3 .github/merge_state.py /tmp/mystate
            for f in state.json state.dry.json; do [ -f "$f" ] && git add -f "$f"; done
            git diff --cached --quiet && exit 0
            git commit -q -m "update post history [skip ci]"
            git push -q origin post-history:main && exit 0
            echo "push raced with another run, retrying"
            sleep $((i * 4))
          done
          exit 1
