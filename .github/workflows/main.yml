name: Post shows to Instagram

on:
  schedule:
    - cron: "0 * * * *"   # GitHub often runs this only every few hours, so each run watches
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: post-shows
  cancel-in-progress: true   # a newer run replaces the one that is watching

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Watch the schedule and post
        env:
          RADIOCO_STATION_ID: ${{ vars.RADIOCO_STATION_ID || 'sd72a8fdcd' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          IGNORE_SHOWS: ${{ vars.IGNORE_SHOWS }}
          COMING_UP_MINUTES: ${{ vars.COMING_UP_MINUTES }}
          COMING_UP_AS: ${{ vars.COMING_UP_AS }}
          LIVE_NOW_AS: ${{ vars.LIVE_NOW_AS }}
          HASHTAGS: ${{ vars.HASHTAGS }}
          POLL_MINUTES: ${{ vars.POLL_MINUTES || '5' }}
        run: python ditch_poster.py --watch ${{ vars.WATCH_MINUTES || '330' }}

      - name: Remember what was posted
        if: always()
        run: |
          git config user.name "ditch-poster"
          git config user.email "ditch-poster@users.noreply.github.com"
          for f in state.json state.dry.json; do [ -f "$f" ] && git add -f "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "update post history [skip ci]"
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 5; done
          exit 1
